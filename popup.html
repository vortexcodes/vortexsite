<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Typer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Human Typer</h1>

    <div class="section">
      <label for="textInput">Text to Type:</label>
      <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    </div>

    <div class="section">
      <div class="checkbox-group">
        <input type="checkbox" id="humanizeMode">
        <label for="humanizeMode">Humanize Text (make it sound more natural)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="smartDiff" checked>
        <label for="smartDiff">Smart Replace (only type new text)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="enableTypos" checked>
        <label for="enableTypos">Enable Random Typos</label>
      </div>
    </div>

    <div class="section">
      <label for="typingSpeed">Typing Speed:</label>
      <select id="typingSpeed">
        <option value="slow">Slow (60-80 WPM)</option>
        <option value="normal" selected>Normal (80-100 WPM)</option>
        <option value="fast">Fast (100-120 WPM)</option>
      </select>
    </div>

    <div class="section">
      <label for="typoFrequency">Typo Frequency:</label>
      <input type="range" id="typoFrequency" min="0" max="10" value="3">
      <span id="typoFrequencyValue">3%</span>
    </div>

    <button id="startTyping" class="btn-primary">Start Typing</button>
    <button id="stopTyping" class="btn-secondary" disabled>Stop</button>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
